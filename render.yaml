services:
  - type: web
    name: unexpected-unified
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: UNEXPECTED_STORAGE_BACKEND
        value: postgres
      - key: UNEXPECTED_APPROVAL_LEDGER_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: UNEXPECTED_RUNTIME_API_TOKEN
        generateValue: true
      - key: UNEXPECTED_DEFAULT_PROVIDER
        value: mock
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      - key: OPENOX_API_KEY
        sync: false
      - key: OPENOX_BASE_URL
        value: https://api.openoxai.com/v1
      - key: OPENOX_MODEL
        value: gpt-6-astra
      - key: UNEXPECTED_MAX_WORKERS
        value: "4"
      - key: UNEXPECTED_MAX_RETRIES
        value: "1"
      - key: UNEXPECTED_STATE_DIR
        value: /tmp/uneXpected-state
