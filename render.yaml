services:
  - type: web
    name: unexpected-unified
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: UNEXPECTED_STORAGE_BACKEND
        value: postgres
      - key: UNEXPECTED_APPROVAL_LEDGER_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: UNEXPECTED_RUNTIME_API_TOKEN
        generateValue: true
      - key: UNEXPECTED_DEFAULT_PROVIDER
        value: mock
      # Initial deployment stays mock-only; no paid model provider is configured by default.
      - key: UNEXPECTED_MAX_WORKERS
        value: "4"
      - key: UNEXPECTED_MAX_RETRIES
        value: "1"
      - key: UNEXPECTED_STATE_DIR
        value: /tmp/uneXpected-state
