<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>uneXpected Creator Studio render test</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1324}canvas{display:block;width:100%;height:100%}</style>
</head>
<body><canvas id="frame" width="1080" height="1920"></canvas>
<script>
(() => {
  const canvas=document.getElementById("frame"),ctx=canvas.getContext("2d"),W=canvas.width,H=canvas.height;
  window.DUR=8;window.READY=true;
  window.render=(seconds)=>{
    const t=Math.max(0,Math.min(window.DUR,seconds)),pulse=.5+.5*Math.sin(t*2.1);
    const gradient=ctx.createLinearGradient(0,0,W,H);
    gradient.addColorStop(0,"#101d37");gradient.addColorStop(1,"#263d5d");
    ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
    for(let i=0;i<11;i++){
      const x=W*(.12+i*.076)+Math.sin(t*.9+i*.7)*40;
      const y=H*(.16+(i%4)*.2)+Math.cos(t*.65+i)*30;
      ctx.beginPath();ctx.arc(x,y,14+24*pulse,0,Math.PI*2);
      ctx.fillStyle="rgba(115,195,230,"+(.16+i*.012)+")";ctx.fill();
    }
    ctx.textAlign="center";ctx.fillStyle="#8fe4d5";ctx.font="700 26px sans-serif";
    ctx.fillText("UNEXPECTED · CREATOR STUDIO",W/2,275);
    ctx.fillStyle="#f4f7ff";ctx.font="700 68px sans-serif";
    ctx.fillText("A film made",W/2,775);ctx.fillText("from code.",W/2,865);
    ctx.fillStyle="#c1ccdd";ctx.font="30px sans-serif";
    ctx.fillText("Original scenes · isolated rendering · no stock footage",W/2,950);
    ctx.fillStyle="#8fe4d5";ctx.font="600 27px sans-serif";
    ctx.fillText("FRAME "+Math.round(t*24+1),W/2,1250);
  };
  window.render(0);
})();
</script></body></html>
