name: uneXpected hosted runtime and Shopify MCP verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hosted-runtime-smoke.yml"

permissions:
  contents: read

concurrency:
  group: uneXpected-hosted-runtime-smoke
  cancel-in-progress: false

jobs:
  hosted-runtime-smoke:
    name: Verify deployed v8 runtime, Shopify sales workflow and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: srv-dbk8217b9u1s73ftauig
      WORKSPACE_ID: tea-dbh2cpks728c73amdq90
      SERVICE_URL: https://unexpected-v8-command-center.onrender.com
    steps:
      - name: Validate Render credential presence
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "::error::RENDER_API_KEY is missing; no Render or runtime request was made."
            exit 1
          fi
          echo "Render API credential is present; its value is not displayed."

      - name: Resolve runtime bearer token without exposing it
        id: runtime-auth
        shell: bash
        run: |
          set -euo pipefail
          service_vars="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 30 \
            --url "https://api.render.com/v1/services/${SERVICE_ID}/env-vars?limit=100" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json")"

          runtime_token="$(printf '%s' "${service_vars}" | jq -r \
            '[.[] | (.envVar // .) | select(.key == "UNEXPECTED_RUNTIME_API_TOKEN") | .value][0] // empty')"

          if [[ -z "${runtime_token}" ]]; then
            groups="$(curl --silent --show-error --fail-with-body \
              --connect-timeout 10 --max-time 30 \
              --url "https://api.render.com/v1/env-groups?ownerId=${WORKSPACE_ID}&limit=100" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json")"

            group_ids="$(printf '%s' "${groups}" | jq -r --arg service "${SERVICE_ID}" \
              '.[] | (.envGroup // .) | select(any(.serviceLinks[]?; .id == $service)) | [.createdAt, .id] | @tsv' | sort -r | cut -f2)"

            while IFS= read -r group_id; do
              [[ -n "${group_id}" ]] || continue
              group="$(curl --silent --show-error --fail-with-body \
                --connect-timeout 10 --max-time 30 \
                --url "https://api.render.com/v1/env-groups/${group_id}" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                --header "Accept: application/json")"
              candidate="$(printf '%s' "${group}" | jq -r \
                '[.envVars[]? | select(.key == "UNEXPECTED_RUNTIME_API_TOKEN") | .value][0] // empty')"
              if [[ -n "${candidate}" ]]; then
                runtime_token="${candidate}"
                break
              fi
            done <<< "${group_ids}"
          fi

          if [[ -z "${runtime_token}" ]]; then
            echo "::error::UNEXPECTED_RUNTIME_API_TOKEN was not found; no authenticated runtime request was made."
            exit 1
          fi

          echo "::add-mask::${runtime_token}"
          echo "RUNTIME_TOKEN=${runtime_token}" >> "${GITHUB_ENV}"
          unset runtime_token service_vars groups candidate

      - name: Check public health and authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 20 \
            --url "${SERVICE_URL}/health" \
            --header "Accept: application/json")"
          printf '%s' "${health}" | jq -e \
            '.ok == true and .storage == "ready" and .authentication_configured == true' >/dev/null
          printf '%s' "${health}" | jq -c '{ok, version, storage, provider, provider_configured, authentication_configured}'

          anonymous_code="$(curl --silent --show-error --output "${RUNNER_TEMP}/anonymous.json" \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 20 \
            --url "${SERVICE_URL}/v1/status" --header "Accept: application/json")"
          if [[ "${anonymous_code}" != "401" ]]; then
            echo "::error::Expected unauthenticated /v1/status to return 401; received ${anonymous_code}."
            exit 1
          fi
          echo "Unauthenticated protected API correctly returned HTTP 401."

          status="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 20 \
            --url "${SERVICE_URL}/v1/status" \
            --header "Authorization: Bearer ${RUNTIME_TOKEN}" \
            --header "Accept: application/json")"
          printf '%s' "${status}" | jq -e \
            '.health.ok == true and .storage.backend == "postgres" and .storage.healthy == true and .registered_agents == 38' >/dev/null
          printf '%s' "${status}" | jq -c '{version, registered_agents, storage, health, governance}'

          agents="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 20 \
            --url "${SERVICE_URL}/v1/agents" \
            --header "Authorization: Bearer ${RUNTIME_TOKEN}" \
            --header "Accept: application/json")"
          printf '%s' "${agents}" | jq -e '.count == 38 and (.items | length == 38)' >/dev/null
          echo "Authenticated agent registry returned 38 roles."

      - name: Verify live OpenRouter provider
        shell: bash
        run: |
          set -euo pipefail
          provider_response="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 15 --max-time 120 \
            --request POST \
            --url "${SERVICE_URL}/v1/providers/test" \
            --header "Authorization: Bearer ${RUNTIME_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data '{"provider_route":"openrouter"}')"
          printf '%s' "${provider_response}" | jq -e \
            '.ok == true and .verified == true and .provider_route == "openrouter" and .provider != "deterministic-mock"' >/dev/null
          printf '%s' "${provider_response}" | jq -c '{provider_route, provider, model, latency_ms, verified}'

      - name: Verify authenticated remote MCP, Shopify workflow and recovery after restart
        shell: bash
        run: |
          set -euo pipefail

          mcp_request() {
            local method="$1"
            local params="$2"
            shift 2
            local body
            body="$(jq -cn --arg method "$method" --argjson params "$params" '{
              jsonrpc: "2.0", id: 1, method: $method,
              params: ($params + {_meta: {
                "io.modelcontextprotocol/protocolVersion": "2026-07-28",
                "io.modelcontextprotocol/clientCapabilities": {}
              }})
            }')"
            curl --silent --show-error --fail-with-body \
              --connect-timeout 15 --max-time 120 \
              --request POST --url "${SERVICE_URL}/mcp" \
              --header "Authorization: Bearer ${RUNTIME_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "Accept: application/json, text/event-stream" \
              --header "Mcp-Method: ${method}" \
              --header "MCP-Protocol-Version: 2026-07-28" \
              --data "${body}" "$@"
          }

          mcp_tool() {
            local name="$1"
            local arguments="$2"
            local params
            params="$(jq -cn --arg name "$name" --argjson arguments "$arguments" \
              '{name: $name, arguments: $arguments}')"
            mcp_request "tools/call" "${params}" \
              --header "Mcp-Name: ${name}"
          }

          structured_result() {
            jq -c '
              if .result.structuredContent? != null then .result.structuredContent
              elif .result.structured_content? != null then .result.structured_content
              else ([.result.content[]? | select(.type == "text") |
                (.text | (try fromjson catch .))][0] // .result)
              end
            '
          }

          anonymous_body="$(jq -cn '{
            jsonrpc:"2.0", id:1, method:"tools/list",
            params:{_meta:{
              "io.modelcontextprotocol/protocolVersion":"2026-07-28",
              "io.modelcontextprotocol/clientCapabilities":{}
            }}
          }')"
          anonymous_code="$(curl --silent --show-error --output "${RUNNER_TEMP}/anonymous-mcp.json" \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 20 \
            --request POST --url "${SERVICE_URL}/mcp" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json, text/event-stream" \
            --header "Mcp-Method: tools/list" \
            --header "MCP-Protocol-Version: 2026-07-28" \
            --data "${anonymous_body}")"
          if [[ "${anonymous_code}" != "401" ]]; then
            echo "::error::Expected anonymous /mcp to return 401; received ${anonymous_code}."
            exit 1
          fi

          catalog="$(mcp_request "tools/list" '{}')"
          printf '%s' "${catalog}" | jq -e '
            ([.result.tools[].name] | sort) ==
            ["get_task","get_task_events","list_agents","list_tasks","run_sales_workflow","run_task","runtime_status"]
          ' >/dev/null
          echo "Authenticated /mcp catalog returned 7 governed tools; anonymous access returned 401."

          status="$(mcp_tool "runtime_status" '{}')"
          status_data="$(printf '%s' "${status}" | structured_result)"
          printf '%s' "${status_data}" | jq -e \
            '.registered_agents == 38 and .health == "ready" and .storage_healthy == true' >/dev/null

          agents="$(mcp_tool "list_agents" '{}')"
          agents_data="$(printf '%s' "${agents}" | structured_result)"
          printf '%s' "${agents_data}" | jq -e '.count == 38 and (.items | length == 38)' >/dev/null

          tasks_before="$(mcp_tool "list_tasks" '{"limit":10}')"
          printf '%s' "${tasks_before}" | structured_result | jq -e '.count >= 0' >/dev/null

          sales_args="$(jq -cn --arg run "${GITHUB_RUN_ID}" '{
            objective: "Run a Shopify commerce-readiness workflow for the connected test store. Assess store readiness from supplied verified shop facts; identify setup blockers, product-catalogue prerequisites, order/payment/fulfillment checks, and the next three internal actions. Do not invent products, customers, orders, revenue, traffic or payment status. Distinguish verified facts from unknowns. Internal test only.",
            inputs: {
              verification_scope: "read-only Shopify context from connected Shopify Admin integration; internal draft-only test",
              shopify_store: {
                name: "My Store", domain: "ybzeyh-yq.myshopify.com",
                country: "Tunisia", currency: "TND", plan: "trial"
              },
              observed_store_data: {
                product_count: 0, order_count: 0,
                customer_count: "not queried", revenue: "not queried"
              },
              constraints: [
                "Use only supplied facts.",
                "Do not create, update, delete, import or publish Shopify products or collections.",
                "Do not create discounts, change inventory, settings or upgrade the Shopify plan.",
                "Do not access customer PII or contact customers.",
                "Do not message, submit forms, publish, quote, book or charge payments.",
                "Label unknown values as unknown and provide a checklist."
              ],
              smoke_run_id: $run
            },
            provider_route: "openrouter",
            deadline_seconds: 90,
            max_corrections: 1,
            max_improvements: 1
          }')"

          sales_response="$(mcp_tool "run_sales_workflow" "${sales_args}")"
          sales_data="$(printf '%s' "${sales_response}" | structured_result)"
          printf '%s' "${sales_data}" | jq -e \
            '.result.status == "delivered" and .result.delivered == true and (.result.workflow_id | type == "string" and length > 0)' >/dev/null

          task_ids="$(printf '%s' "${sales_data}" | jq -r \
            '[.. | objects | .task_id? // empty | select(type == "string" and length > 0)] | unique[]')"
          if [[ -z "${task_ids}" ]]; then
            echo "::error::Shopify workflow returned no persistent task IDs."
            exit 1
          fi

          first_task=""
          checked=0
          while IFS= read -r task_id; do
            [[ -n "${task_id}" ]] || continue
            [[ -n "${first_task}" ]] || first_task="${task_id}"
            task_response="$(mcp_tool "get_task" "$(jq -cn --arg id "${task_id}" '{task_id:$id}')")"
            task_data="$(printf '%s' "${task_response}" | structured_result)"
            printf '%s' "${task_data}" | jq -e --arg id "${task_id}" '.task.task_id == $id' >/dev/null

            events_response="$(mcp_tool "get_task_events" \
              "$(jq -cn --arg id "${task_id}" '{task_id:$id,after_event_id:0,limit:50}')")"
            events_data="$(printf '%s' "${events_response}" | structured_result)"
            printf '%s' "${events_data}" | jq -e '.count > 0 and (.items | length > 0)' >/dev/null
            checked=$((checked + 1))
          done <<< "${task_ids}"

          if [[ -z "${first_task}" || "${checked}" -lt 1 ]]; then
            echo "::error::No task could be retrieved before restart."
            exit 1
          fi
          echo "Shopify workflow delivered; ${checked} persisted task(s) and event histories were retrieved before restart."

          restart_code="$(curl --silent --show-error --output "${RUNNER_TEMP}/render-restart.json" \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 30 \
            --request POST --url "https://api.render.com/v1/services/${SERVICE_ID}/restart" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json")"
          if [[ ! "${restart_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Render restart request failed (HTTP ${restart_code})."
            cat "${RUNNER_TEMP}/render-restart.json"
            exit 1
          fi

          healthy="false"
          for attempt in $(seq 1 60); do
            sleep 5
            if curl --silent --show-error --fail --connect-timeout 5 --max-time 10 \
                --url "${SERVICE_URL}/health" --header "Accept: application/json" \
                --output "${RUNNER_TEMP}/health-after-restart.json"; then
              if jq -e '.ok == true and .storage == "ready"' \
                  "${RUNNER_TEMP}/health-after-restart.json" >/dev/null; then
                healthy="true"
                break
              fi
            fi
          done
          if [[ "${healthy}" != "true" ]]; then
            echo "::error::Runtime did not return healthy after the requested restart."
            exit 1
          fi

          post_restart_checks=0
          while IFS= read -r task_id; do
            [[ -n "${task_id}" ]] || continue
            task_response="$(mcp_tool "get_task" "$(jq -cn --arg id "${task_id}" '{task_id:$id}')")"
            task_data="$(printf '%s' "${task_response}" | structured_result)"
            printf '%s' "${task_data}" | jq -e --arg id "${task_id}" '.task.task_id == $id' >/dev/null

            events_response="$(mcp_tool "get_task_events" \
              "$(jq -cn --arg id "${task_id}" '{task_id:$id,after_event_id:0,limit:50}')")"
            events_data="$(printf '%s' "${events_response}" | structured_result)"
            printf '%s' "${events_data}" | jq -e '.count > 0 and (.items | length > 0)' >/dev/null
            post_restart_checks=$((post_restart_checks + 1))
          done <<< "${task_ids}"

          if [[ "${post_restart_checks}" -ne "${checked}" ]]; then
            echo "::error::Task recovery count changed after restart."
            exit 1
          fi
          echo "SUCCESS: bearer authentication, live MCP, Shopify Sales Control Center workflow, persisted task retrieval, Render restart and post-restart recovery all passed."
